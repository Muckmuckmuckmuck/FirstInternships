<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" opacity=".12"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#07150d" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#102d20"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="1130" cy="-40" r="290" fill="#376d4f" opacity=".25"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="64" y="58" width="38" height="38" rx="11" fill="#d9f99d"/>
    <text x="83" y="83" text-anchor="middle" font-size="16" font-weight="800" fill="#102d20">fi</text>
    <text x="116" y="85" font-size="26" font-weight="800" fill="#ffffff">firstinternships</text>

    <rect x="64" y="138" width="318" height="38" rx="9" fill="#d9f99d" fill-opacity=".1" stroke="#d9f99d" stroke-opacity=".4"/>
    <text x="82" y="162" font-size="15" font-weight="700" letter-spacing="1.3" fill="#d9f99d">COLLEGE STUDENTS ONLY</text>

    <text x="64" y="250" font-size="58" font-weight="700" letter-spacing="-2.5" fill="#ffffff">The internship board</text>
    <text x="64" y="318" font-size="58" font-weight="700" letter-spacing="-2.5" fill="#ffffff">that knows</text>
    <text x="64" y="386" font-size="58" font-weight="700" letter-spacing="-2.5" fill="#d9f99d">what year you’re in.</text>
    <text x="64" y="446" font-size="21" fill="#bdcbbf">College-only opportunities, sorted by the first year</text>
    <text x="64" y="478" font-size="21" fill="#bdcbbf">you’re actually allowed to apply.</text>

    <g filter="url(#shadow)">
      <rect x="728" y="147" width="390" height="78" rx="17" fill="#d9f99d"/>
      <circle cx="770" cy="186" r="24" fill="none" stroke="#14251b" stroke-opacity=".18"/>
      <text x="770" y="192" text-anchor="middle" font-size="14" font-weight="800" fill="#14251b">01</text>
      <text x="809" y="182" font-size="21" font-weight="700" fill="#14251b">First-year</text>
      <text x="809" y="203" font-size="13" fill="#425148">Start exploring early</text>

      <rect x="748" y="239" width="390" height="78" rx="17" fill="#c9e9ff"/>
      <circle cx="790" cy="278" r="24" fill="none" stroke="#14251b" stroke-opacity=".18"/>
      <text x="790" y="284" text-anchor="middle" font-size="14" font-weight="800" fill="#14251b">02</text>
      <text x="829" y="274" font-size="21" font-weight="700" fill="#14251b">Sophomore</text>
      <text x="829" y="295" font-size="13" fill="#425148">Build real experience</text>

      <rect x="768" y="331" width="390" height="78" rx="17" fill="#ffd8c8"/>
      <circle cx="810" cy="370" r="24" fill="none" stroke="#14251b" stroke-opacity=".18"/>
      <text x="810" y="376" text-anchor="middle" font-size="14" font-weight="800" fill="#14251b">03</text>
      <text x="849" y="366" font-size="21" font-weight="700" fill="#14251b">Junior</text>
      <text x="849" y="387" font-size="13" fill="#425148">Prime recruiting year</text>

      <rect x="788" y="423" width="390" height="78" rx="17" fill="#e4d8ff"/>
      <circle cx="830" cy="462" r="24" fill="none" stroke="#14251b" stroke-opacity=".18"/>
      <text x="830" y="468" text-anchor="middle" font-size="14" font-weight="800" fill="#14251b">04</text>
      <text x="869" y="458" font-size="21" font-weight="700" fill="#14251b">Senior</text>
      <text x="869" y="479" font-size="13" fill="#425148">Intern-to-offer paths</text>
    </g>

    <rect x="64" y="544" width="260" height="44" rx="10" fill="#ff6741"/>
    <text x="194" y="572" text-anchor="middle" font-size="16" font-weight="800" fill="#1e1d18">firstinternships.com</text>
  </g>
</svg>
